name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check that the tag matches version.php
        run: |
          RELEASE=$(grep -oP "release\s*=\s*'\K[^']+" version.php)
          if [ "$RELEASE" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Tag v${{ steps.version.outputs.VERSION }} does not match \$plugin->release '$RELEASE' in version.php" >&2
            exit 1
          fi

      - name: Create release zip
        run: |
          mkdir -p release/gear
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.continue' \
            --exclude='.qwen' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.eslintignore' \
            --exclude='.stylelintignore' \
            --exclude='.phpcs.xml.dist' \
            --exclude='.moodle-plugin-ci.yml' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='description.html' \
            --exclude='MIGRATION_*.md' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='Gruntfile.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            ./ release/gear/
          cd release && zip -r ../moodle-mod_gear-${{ steps.version.outputs.VERSION }}.zip gear

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: moodle-mod_gear-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
